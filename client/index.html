<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice CAPTCHA</title>
</head>
<body>
  <h1>Record your voice (7s)</h1>
  <button id="startBtn">Start Recording</button>
  <button id="stopBtn" disabled>Stop Recording</button>
  <p id="status"></p>

  <script src="wavEncoder.js"></script>
  <script>
    let mediaRecorder;
    let audioChunks = [];

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const status = document.getElementById("status");

    startBtn.onclick = async () => {
      audioChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = sendAudio;

      mediaRecorder.start();
      status.textContent = "Recording...";
      startBtn.disabled = true;
      stopBtn.disabled = false;

      // Automatically stop after 7 seconds
      setTimeout(() => stopBtn.click(), 7000);
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      status.textContent = "Stopping...";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    async function sendAudio() {
      // Convert recorded chunks (WebM/Opus) to WAV using wavEncoder.js
      const wavBlob = await window.chunksToWavBlob(audioChunks);

      const formData = new FormData();
      formData.append("file", wavBlob, "recording.wav");

      status.textContent = "Sending to server...";

      try {
        const response = await fetch("https://localhost:443/detect", {
          method: "POST",
          body: formData
        });

        const result = await response.json();
        status.textContent = `Result: ${result.approved ? "Human ✅" : "AI ❌"} (Confidence: ${result.confidence}%)`;
      } catch (err) {
        status.textContent = "Error sending audio.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
