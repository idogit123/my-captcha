<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice CAPTCHA</title>
</head>
<body>
  <h1>Record your voice (5s)</h1>
  <p id="prompt" style="font-weight:bold;"></p>
  <button id="startBtn">Get Prompt</button>
  <button id="stopBtn" disabled>Stop Recording</button>
  <p id="status"></p>

  <script src="wavEncoder.js"></script>
  <script>
    let mediaRecorder;
    let audioChunks = [];
    let readyToRecord = false;
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const status = document.getElementById("status");
    const promptElem = document.getElementById("prompt");

    async function fetchPrompt() {
      status.textContent = "Getting prompt...";
      startBtn.disabled = true;
      promptElem.textContent = "";
      try {
        const response = await fetch("https://localhost:443/prompt");
        const data = await response.json();
        promptElem.textContent = data.prompt;
        startBtn.textContent = "Start Recording";
        startBtn.disabled = false;
        status.textContent = "Say the prompt above and record your voice.";
      } catch (err) {
        status.textContent = "Error getting prompt.";
        startBtn.disabled = true;
        console.log(err);
      }
    }

    startBtn.onclick = async () => {
      if (!readyToRecord) {
        await fetchPrompt();
        readyToRecord = true;
        return;
      }
      audioChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = sendAudio;

      mediaRecorder.start();
      status.textContent = "Recording...";
      startBtn.disabled = true;
      stopBtn.disabled = false;

      // Automatically stop after 5 seconds
      setTimeout(() => stopBtn.click(), 5000);
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      status.textContent = "Stopping...";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    async function sendAudio() {
      // Convert recorded chunks (WebM/Opus) to WAV using wavEncoder.js
      const wavBlob = await window.chunksToWavBlob(audioChunks);

      const formData = new FormData();
      formData.append("file", wavBlob, "recording.wav");

      status.textContent = "Sending to server...";

      try {
        const response = await fetch("https://localhost:443/detect", {
          method: "POST",
          body: formData
        });

        if (response.status === 403) {
          const result = await response.json();
          status.textContent = result.error || "You are banned due to repeated failed attempts.";
          startBtn.disabled = true;
          stopBtn.disabled = true;
          return;
        }

        const result = await response.json();
        status.textContent = `Result: ${result.approved ? "Human ✅" : "AI ❌"} (Confidence: ${result.confidence}%)`;
        
        // Reset for next attempt
        startBtn.textContent = "Get Prompt";
        readyToRecord = false;
        startBtn.disabled = false;
      } catch (err) {
        status.textContent = "Error sending audio.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
