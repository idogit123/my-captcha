<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice CAPTCHA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Set API base URL here. Change to empty string to use relative paths. -->
  <meta name="api-base-url" content="https://localhost:443">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="main-container">
    <div id="left-container">
      <h1>🎤 Voice CAPTCHA</h1>
      <div id="button-container">
        <button id="startBtn">Get Prompt</button>
        <button id="stopBtn" disabled>Stop Recording</button>
      </div>
      <p id="prompt"></p>
      <div id="volume-container">
        <span id="volume-label">Volume</span>
        <div id="volume-meter">
          <div id="volume-bar"></div>
        </div>
      </div>
      <div id="status-container">
        <p id="status"></p>
      </div>
    </div>
    <div id="right-container">
      <h2>Results:</h2>
      <div id="deepfake-results">
        <h3>Deepfake Detection Results:</h3>
        <p><span id="deepfake-label"></span> confidence: <span id="deepfake-confidence"></span></p>
      </div>
      <div id="stt-results">
        <h3>Speech-to-Text Results:</h3>
        <div id="stt-results-container">
            <p>You said: <span id="stt-transcription"></span></p>
            <p>Prompt: <span id="stt-prompt"></span></p>
            <p>Similarity: <span id="stt-similarity"></span></p>
        </div>
      </div>
      <div id="final-results">
        <h3>Final Results:</h3>
        <p></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
